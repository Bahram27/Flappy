<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flappy Bahram</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700;900&display=swap');
:root{--gold:#FFD700;--blue:#4FC3F7;--green:#69F0AE;--dark:#0a0015;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;font-family:'Boogaloo',cursive;overflow:hidden;user-select:none;-webkit-user-select:none;}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a0535 0%,#000 100%);}
#gc{position:relative;width:100%;height:100%;max-width:430px;max-height:100vh;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:auto;}
.screen.hidden{display:none!important;}
#menuScreen{background:linear-gradient(180deg,#0a001a 0%,#1a0535 40%,#2d0d5e 100%);}
.logo-bird{font-size:72px;display:block;text-align:center;animation:bf 1.5s ease-in-out infinite alternate;filter:drop-shadow(0 0 20px rgba(255,200,0,0.8));}
.logo-main{font-size:clamp(38px,12vw,58px);color:var(--gold);text-shadow:0 0 30px rgba(255,215,0,0.9),0 4px 0 #8B6914;letter-spacing:2px;animation:lf 2s ease-in-out infinite;}
.by-line{font-family:'Nunito',sans-serif;font-size:13px;color:rgba(255,255,255,0.5);letter-spacing:2px;margin-top:2px;}
.creator-badge{background:linear-gradient(135deg,#FFD700,#FF8C00);border-radius:20px;padding:10px 28px;margin:10px 0 20px;box-shadow:0 4px 20px rgba(255,140,0,0.6);}
.creator-name{font-size:clamp(17px,5vw,22px);color:#1a0800;font-weight:900;letter-spacing:1px;font-family:'Nunito',sans-serif;text-align:center;}
.creator-title{font-size:11px;color:#4a2800;text-align:center;font-family:'Nunito',sans-serif;}
.coin-display{display:flex;align-items:center;gap:8px;background:rgba(255,215,0,0.15);border:2px solid rgba(255,215,0,0.4);border-radius:30px;padding:8px 22px;margin-bottom:18px;}
.coin-val{font-size:26px;color:var(--gold);text-shadow:0 0 10px rgba(255,215,0,0.8);}
.menu-btns{display:flex;flex-direction:column;gap:13px;width:80%;max-width:260px;}
.btn{border:none;border-radius:50px;padding:clamp(12px,4vw,16px) 30px;font-family:'Boogaloo',cursive;font-size:clamp(20px,6vw,26px);cursor:pointer;letter-spacing:1px;width:100%;-webkit-appearance:none;transition:transform 0.1s;}
.btn:active{transform:scale(0.94);}
.btn-play{background:linear-gradient(135deg,#FF6EC7,#FF3CAC);color:white;box-shadow:0 6px 0 #A0236B,0 8px 20px rgba(255,60,172,0.4);}
.btn-shop{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#1a0800;box-shadow:0 6px 0 #8B5000,0 8px 20px rgba(255,140,0,0.3);}
.btn-levels{background:linear-gradient(135deg,#4FC3F7,#0288D1);color:white;box-shadow:0 6px 0 #01579B,0 8px 20px rgba(2,136,209,0.3);}
#hud{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;}
#hud.hidden{display:none;}
.hud-score{font-size:clamp(38px,12vw,54px);color:white;text-shadow:0 3px 0 rgba(0,0,0,0.4);}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.hud-level{background:rgba(79,195,247,0.25);border:2px solid rgba(79,195,247,0.5);border-radius:20px;padding:4px 12px;font-size:14px;color:var(--blue);}
.hud-coins{background:rgba(255,215,0,0.2);border:2px solid rgba(255,215,0,0.4);border-radius:20px;padding:4px 12px;font-size:14px;color:var(--gold);display:flex;align-items:center;gap:5px;}
#tapScreen{background:rgba(0,0,0,0.4);}
#deadScreen{background:rgba(5,0,20,0.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.dead-panel{background:linear-gradient(160deg,#1a0535,#2d0d5e);border:2px solid rgba(255,215,0,0.3);border-radius:28px;padding:28px 32px;width:82%;max-width:300px;text-align:center;box-shadow:0 0 60px rgba(255,100,200,0.2);}
.dead-medal{font-size:60px;animation:mp 0.5s ease;}
.dead-title{font-size:30px;color:white;margin:8px 0 4px;}
.dead-score{font-size:50px;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.7);}
.dead-best{font-size:15px;color:rgba(255,255,255,0.6);margin:4px 0 8px;font-family:'Nunito',sans-serif;}
.dead-earned{font-size:20px;color:var(--green);margin-bottom:16px;}
.dead-btns{display:flex;gap:10px;justify-content:center;margin-top:12px;}
.btn-sm{padding:12px 22px;font-size:20px;border-radius:40px;border:none;cursor:pointer;font-family:'Boogaloo',cursive;}
.btn-retry{background:linear-gradient(135deg,#FF6EC7,#FF3CAC);color:white;box-shadow:0 4px 0 #A0236B;}
.btn-menu2{background:linear-gradient(135deg,#9c27b0,#673ab7);color:white;box-shadow:0 4px 0 #311B92;}
#shopScreen{background:linear-gradient(180deg,#0a001a,#1a0535);padding:20px;overflow-y:auto;justify-content:flex-start;padding-top:24px;}
.shop-title{font-size:32px;color:var(--gold);margin-bottom:6px;}
.shop-coins-row{font-size:20px;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:6px;}
.bird-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-bottom:16px;}
.bird-card{background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.12);border-radius:20px;padding:16px 10px;text-align:center;cursor:pointer;position:relative;transition:transform 0.15s;}
.bird-card:active{transform:scale(0.95);}
.bird-card.selected{border-color:var(--gold);background:rgba(255,215,0,0.12);box-shadow:0 0 20px rgba(255,215,0,0.3);}
.bird-emoji{font-size:40px;display:block;margin-bottom:6px;}
.bird-name{font-size:14px;color:white;margin-bottom:4px;font-family:'Nunito',sans-serif;font-weight:700;}
.bird-price{font-size:13px;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:3px;}
.owned-tag{position:absolute;top:6px;right:6px;background:var(--green);color:#003300;font-size:10px;padding:2px 6px;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:700;}
.selected-tag{position:absolute;top:6px;right:6px;background:var(--gold);color:#1a0800;font-size:10px;padding:2px 6px;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:700;}
.btn-back{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);color:white;padding:12px 40px;font-size:20px;border-radius:40px;cursor:pointer;font-family:'Boogaloo',cursive;margin-top:8px;-webkit-appearance:none;}
#levelsScreen{background:linear-gradient(180deg,#0a001a,#1a0535);padding:20px;}
.levels-title{font-size:32px;color:var(--blue);margin-bottom:16px;}
.level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:340px;margin-bottom:20px;}
.level-card{background:rgba(79,195,247,0.1);border:2px solid rgba(79,195,247,0.3);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;transition:transform 0.15s;position:relative;}
.level-card:active{transform:scale(0.95);}
.level-card.active-lv{border-color:var(--blue);background:rgba(79,195,247,0.2);box-shadow:0 0 20px rgba(79,195,247,0.3);}
.level-card.locked-lv{opacity:0.4;cursor:not-allowed;}
.level-num{font-size:22px;color:white;}
.level-name{font-size:10px;color:var(--blue);font-family:'Nunito',sans-serif;margin-top:2px;}
.level-stars-row{font-size:12px;}
.fc{position:absolute;font-size:22px;pointer-events:none;animation:cf 0.8s ease-out forwards;z-index:200;}
@keyframes bf{from{transform:translateY(0) rotate(-5deg);}to{transform:translateY(-14px) rotate(5deg);}}
@keyframes lf{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes mp{from{transform:scale(0) rotate(-20deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
@keyframes cf{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-70px) scale(0.3);opacity:0;}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.shake{animation:shake 0.35s ease;}
</style>
</head>
<body>
<div id="app"><div id="gc">
<canvas id="canvas"></canvas>
<div id="hud" class="hidden">
  <div class="hud-score" id="hudScore">0</div>
  <div class="hud-right">
    <div class="hud-level" id="hudLevel">Səviyyə 1</div>
    <div class="hud-coins">🪙 <span id="hudCoins">0</span></div>
  </div>
</div>
<div class="screen" id="menuScreen">
  <span class="logo-bird" id="menuBird">🐦</span>
  <div class="logo-main">FLAPPY</div>
  <div class="by-line">CREATED BY</div>
  <div class="creator-badge">
    <div class="creator-name">✨ BAHRAM MAHMUD ✨</div>
    <div class="creator-title">OYUN USTASI · GAME MASTER</div>
  </div>
  <div class="coin-display">
    <span style="font-size:22px">🪙</span>
    <span class="coin-val" id="menuCoins">0</span>
    <span style="color:rgba(255,215,0,0.6);font-size:14px">pul</span>
  </div>
  <div class="menu-btns">
    <button class="btn btn-play" id="btnPlay">▶ OYNA</button>
    <button class="btn btn-shop" id="btnShop">🛒 MAĞAZA</button>
    <button class="btn btn-levels" id="btnLevels">⚡ SƏVİYYƏLƏR</button>
  </div>
  <div style="position:absolute;bottom:14px;font-family:'Nunito',sans-serif;font-size:11px;color:rgba(255,255,255,0.25)">Bahram Mahmud © 2024</div>
</div>
<div class="screen hidden" id="tapScreen">
  <div style="text-align:center;pointer-events:none">
    <div style="font-size:clamp(26px,8vw,38px);color:white;text-shadow:0 0 20px rgba(255,255,255,0.5)">Toxun!</div>
    <div style="font-size:clamp(56px,18vw,80px);animation:bf 1s ease-in-out infinite alternate" id="tapBird">🐦</div>
    <div style="font-family:'Nunito',sans-serif;font-size:14px;color:rgba(255,255,255,0.7);margin-top:8px">Ekrana toxunaraq başla</div>
  </div>
</div>
<div class="screen hidden" id="deadScreen">
  <div class="dead-panel">
    <div class="dead-medal" id="deadMedal">💀</div>
    <div class="dead-title" id="deadTitle">Yenidən cəhd et!</div>
    <div class="dead-score" id="deadScore">0</div>
    <div class="dead-best" id="deadBest">🏆 Rekord: 0</div>
    <div class="dead-earned" id="deadEarned">+0 🪙</div>
    <div class="dead-btns">
      <button class="btn-sm btn-retry" id="btnRetry">↺ Yenidən</button>
      <button class="btn-sm btn-menu2" id="btnMenu">🏠 Menyu</button>
    </div>
  </div>
</div>
<div class="screen hidden" id="shopScreen">
  <div class="shop-title">🛒 Mağaza</div>
  <div class="shop-coins-row">🪙 <span id="shopCoins">0</span> pul</div>
  <div class="bird-grid" id="birdGrid"></div>
  <button class="btn-back" id="btnShopBack">← Geri</button>
</div>
<div class="screen hidden" id="levelsScreen">
  <div class="levels-title">⚡ Səviyyələr</div>
  <div class="level-grid" id="levelGrid"></div>
  <button class="btn-back" id="btnLevelsBack">← Geri</button>
</div>
</div></div>
<script>
let actx;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function beep(f,t,d,g=0.3){try{const a=ac(),o=a.createOscillator(),gn=a.createGain();o.connect(gn);gn.connect(a.destination);o.type=t;o.frequency.value=f;gn.gain.setValueAtTime(g,a.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.start();o.stop(a.currentTime+d);}catch(e){}}
function sfxFlap(){beep(700,'sine',0.08,0.18);}
function sfxPoint(){beep(880,'sine',0.08,0.25);setTimeout(()=>beep(1100,'sine',0.08,0.25),80);setTimeout(()=>beep(1320,'sine',0.12,0.2),160);}
function sfxCoin(){beep(1200,'sine',0.05,0.18);setTimeout(()=>beep(1600,'sine',0.07,0.18),60);}
function sfxDie(){beep(280,'sawtooth',0.3,0.4);setTimeout(()=>beep(180,'sawtooth',0.25,0.3),150);}
function sfxBuy(){beep(600,'sine',0.1,0.12);setTimeout(()=>beep(900,'sine',0.1,0.12),80);setTimeout(()=>beep(1200,'sine',0.12,0.15),160);}
function sfxLvlUp(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,'sine',0.18,0.25),i*100));}
function sv(k,v){try{localStorage.setItem('fb2_'+k,JSON.stringify(v));}catch(e){}}
function ld(k,d){try{const v=localStorage.getItem('fb2_'+k);return v!==null?JSON.parse(v):d;}catch(e){return d;}}
const BIRDS=[
  {id:'classic',e:'🐦',n:'Sarı Quş',p:0,d:'Klassik'},
  {id:'parrot',e:'🦜',n:'Tutuquşu',p:50,d:'Cəsur'},
  {id:'owl',e:'🦉',n:'Bayquş',p:120,d:'Müdrik'},
  {id:'eagle',e:'🦅',n:'Qartal',p:200,d:'Güclü'},
  {id:'penguin',e:'🐧',n:'Pinqvin',p:300,d:'Gülməli'},
  {id:'dragon',e:'🐲',n:'Əjdaha',p:500,d:'Nəhayət!'},
];
const LEVELS=[
  {id:1,n:'☀️ Günəşli',speed:2.2,gap:175,rate:110,bg:'day',need:0},
  {id:2,n:'🌲 Meşə',speed:2.7,gap:162,rate:100,bg:'forest',need:5},
  {id:3,n:'🌙 Gecə',speed:3.1,gap:150,rate:92,bg:'night',need:12},
  {id:4,n:'⛈️ Fırtına',speed:3.7,gap:140,rate:85,bg:'storm',need:20},
  {id:5,n:'🚀 Kosmik',speed:4.2,gap:130,rate:78,bg:'space',need:30},
  {id:6,n:'🔥 Cəhənnəm',speed:5.2,gap:120,rate:70,bg:'hell',need:45},
];
let GS={coins:ld('coins',0),best:ld('best',0),owned:ld('owned',['classic']),bird:ld('bird','classic'),level:ld('level',1),stars:ld('stars',{1:0})};
const cvs=document.getElementById('canvas');
const ctx=cvs.getContext('2d');
function W(){return cvs.width;}
function H(){return cvs.height;}
function resize(){const g=document.getElementById('gc');cvs.width=g.offsetWidth;cvs.height=g.offsetHeight;}
resize();window.addEventListener('resize',resize);
let bird,pipes,gcoins,parts,frame,running,over,score,sessCoins,lv,goff,animId,lastT;
function init(){
  lv=LEVELS.find(l=>l.id===GS.level)||LEVELS[0];
  bird={x:W()*0.22,y:H()/2,vy:0,wp:0};
  pipes=[];gcoins=[];parts=[];
  frame=0;score=0;sessCoins=0;running=false;over=false;goff=0;
  $('hudScore').textContent='0';
  $('hudCoins').textContent=GS.coins;
  $('hudLevel').textContent='Səviyyə '+lv.id;
}
function $(id){return document.getElementById(id);}
function drawBG(){
  const palettes={day:['#87CEEB','#64B5F6','#BBDEFB'],forest:['#1B5E20','#2E7D32','#388E3C'],night:['#0a0015','#1a0535','#2d0d5e'],storm:['#1a1a2e','#2c2c54','#474787'],space:['#000005','#0a001a','#100030'],hell:['#1a0000','#3d0000','#7f0000']};
  const p=palettes[lv.bg]||palettes.night;
  const g=ctx.createLinearGradient(0,0,0,H()-80);
  g.addColorStop(0,p[0]);g.addColorStop(0.5,p[1]);g.addColorStop(1,p[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W(),H());
  if(['night','storm','space','hell'].includes(lv.bg)){
    for(let i=0;i<50;i++){const sx=(i*137.5+frame*0.15)%W(),sy=(i*83)%(H()*0.72),a=0.25+0.75*Math.abs(Math.sin(i*0.7+frame*0.025));ctx.beginPath();ctx.arc(sx,sy,i%4===0?1.5:0.8,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();}
  }
  if(lv.bg==='hell'){for(let i=0;i<4;i++){const fx=(i*200+frame*2)%W(),rg=ctx.createRadialGradient(fx,H()-80,0,fx,H()-80,60);rg.addColorStop(0,'rgba(255,80,0,0.25)');rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.fillRect(0,0,W(),H());}}
}
function drawGround(){
  goff=(goff-lv.speed+40)%40-40;
  const gy=H()-80;
  const palettes={day:['#4CAF50','#388E3C','#1B5E20'],forest:['#33691E','#2E7D32','#1B5E20'],night:['#37474F','#263238','#102027'],storm:['#455A64','#37474F','#263238'],space:['#4a148c','#311b92','#1a0057'],hell:['#b71c1c','#7f0000','#3d0000']};
  const p=palettes[lv.bg]||palettes.night;
  const gg=ctx.createLinearGradient(0,gy,0,H());
  gg.addColorStop(0,p[0]);gg.addColorStop(0.2,p[1]);gg.addColorStop(1,p[2]);
  ctx.fillStyle=gg;ctx.fillRect(0,gy,W(),80);
  const gc2={day:'#66BB6A',forest:'#558B2F',night:'#546E7A',storm:'#607D8B',space:'#7E57C2',hell:'#ef5350'};
  ctx.fillStyle=gc2[lv.bg]||'#546E7A';
  for(let x=goff;x<W()+40;x+=40){ctx.beginPath();ctx.ellipse(x,gy+4,20,7,0,0,Math.PI);ctx.fill();}
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W(),gy);ctx.stroke();
}
function drawPipe(x,th){
  const pw=56,bY=th+lv.gap,bH=H()-80-bY;
  const cols={day:['#2ECC71','#58D68D','#1A8A4A'],forest:['#388E3C','#66BB6A','#1B5E20'],night:['#455A64','#78909C','#263238'],storm:['#546E7A','#90A4AE','#37474F'],space:['#6A1B9A','#AB47BC','#4A148C'],hell:['#C62828','#EF5350','#7F0000']};
  const c=cols[lv.bg]||cols.night;
  const pg=ctx.createLinearGradient(x,0,x+pw,0);
  pg.addColorStop(0,c[0]);pg.addColorStop(0.4,c[1]);pg.addColorStop(1,c[2]);
  ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(x,0,pw,th-12,[0,0,4,4]);ctx.fill();
  ctx.fillStyle=c[2];ctx.beginPath();ctx.roundRect(x-7,th-30,pw+14,28,[5,5,5,5]);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(x+6,4,10,th-16);
  ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(x,bY+14,pw,bH,[4,4,0,0]);ctx.fill();
  ctx.fillStyle=c[2];ctx.beginPath();ctx.roundRect(x-7,bY,pw+14,28,[5,5,5,5]);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(x+6,bY+16,10,bH-10);
  if(lv.id>=4){ctx.fillStyle='rgba(255,30,30,0.12)';for(let s=0;s<th;s+=24)ctx.fillRect(x,s,pw,12);}
}
function drawBird(){
  const bd=BIRDS.find(b=>b.id===GS.bird)||BIRDS[0];
  bird.wp+=0.3;
  ctx.save();ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.min(Math.max(bird.vy*3.5,-30),90)*Math.PI/180);
  ctx.globalAlpha=0.18;ctx.beginPath();ctx.ellipse(2,16,15,5,0,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.globalAlpha=1;
  const sz=Math.round(W()*0.1);ctx.font=sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const sc=1+Math.sin(bird.wp)*0.06;ctx.scale(sc,1-sc*0.03);ctx.fillText(bd.e,0,0);ctx.restore();
}
function addParts(x,y,col,n=8){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4-1,l:1,c:col});}
function drawParts(){parts.forEach(p=>{ctx.globalAlpha=p.l;ctx.beginPath();ctx.arc(p.x,p.y,4*p.l,0,Math.PI*2);ctx.fillStyle=p.c;ctx.fill();});ctx.globalAlpha=1;parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=0.04;});parts=parts.filter(p=>p.l>0);}
function addCoin(x,y){gcoins.push({x,y,a:0,done:false});}
function drawCoins(){
  gcoins.forEach(c=>{if(c.done)return;c.a+=0.1;c.x-=lv.speed;const sc=1+Math.sin(c.a)*0.12;ctx.save();ctx.translate(c.x,c.y+Math.sin(c.a)*4);ctx.scale(sc,sc);ctx.font=Math.round(W()*0.065)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🪙',0,0);ctx.restore();});
  gcoins=gcoins.filter(c=>!c.done&&c.x>-30);
}
function checkCoins(){
  const R=W()*0.06;
  gcoins.forEach(c=>{if(c.done)return;const dx=bird.x-c.x,dy=bird.y-c.y;if(Math.sqrt(dx*dx+dy*dy)<R+14){c.done=true;sessCoins++;GS.coins++;$('hudCoins').textContent=GS.coins;sfxCoin();addParts(c.x,c.y,'#FFD700',5);floatCoin(c.x,c.y);}});
}
function floatCoin(cx,cy){const gc=document.getElementById('gc'),r=gc.getBoundingClientRect(),sx=cx*(r.width/W()),sy=cy*(r.height/H()),el=document.createElement('div');el.className='fc';el.textContent='🪙';el.style.left=sx+'px';el.style.top=sy+'px';gc.appendChild(el);setTimeout(()=>el.remove(),900);}
function hit(){
  const R=W()*0.042;
  if(bird.y+R>=H()-83||bird.y-R<=2)return true;
  for(const p of pipes){if(bird.x+R>p.x+5&&bird.x-R<p.x+51){if(bird.y-R<p.th||bird.y+R>p.th+lv.gap)return true;}}
  return false;
}
function flap(){if(!running||over)return;bird.vy=-8.4;sfxFlap();addParts(bird.x-10,bird.y+10,'rgba(255,210,50,0.7)',5);}
function loop(ts){
  if(over)return;
  animId=requestAnimationFrame(loop);
  if(!lastT)lastT=ts;lastT=ts;
  ctx.clearRect(0,0,W(),H());drawBG();
  if(!running){bird.y=H()/2+Math.sin(ts/600)*18;drawBird();drawGround();return;}
  if(frame%lv.rate===0){const mn=60,mx=H()-80-lv.gap-60,th=mn+Math.random()*(mx-mn);pipes.push({x:W()+10,th,ok:false});if(Math.random()<0.45)addCoin(W()+40,th+lv.gap/2);}
  pipes.forEach(p=>{p.x-=lv.speed;drawPipe(p.x,p.th);if(!p.ok&&p.x+56<bird.x){p.ok=true;score++;$('hudScore').textContent=score;sfxPoint();addParts(bird.x,bird.y,'rgba(100,255,180,0.8)',8);}});
  pipes=pipes.filter(p=>p.x+70>0);
  drawGround();drawCoins();drawParts();
  bird.vy+=0.38;bird.y+=bird.vy;drawBird();checkCoins();
  if(hit()){over=true;sfxDie();saveDeath();setTimeout(showDead,600);cancelAnimationFrame(animId);}
  frame++;
}
function saveDeath(){
  if(score>GS.best){GS.best=score;sv('best',GS.best);}sv('coins',GS.coins);
  const s=score>=lv.id*15?3:score>=lv.id*8?2:score>=lv.id*3?1:0;
  if(!GS.stars[lv.id]||GS.stars[lv.id]<s){GS.stars[lv.id]=s;sv('stars',GS.stars);}
}
const SCREENS=['menuScreen','tapScreen','deadScreen','shopScreen','levelsScreen'];
function show(id){SCREENS.forEach(s=>{$(s).classList[s===id?'remove':'add']('hidden');});$('hud').classList.add('hidden');}
function showMenu(){if(animId)cancelAnimationFrame(animId);over=true;show('menuScreen');$('menuCoins').textContent=GS.coins;const bd=BIRDS.find(b=>b.id===GS.bird)||BIRDS[0];$('menuBird').textContent=bd.e;}
function startGame(){over=false;if(animId)cancelAnimationFrame(animId);init();show('tapScreen');$('hud').classList.remove('hidden');const bd=BIRDS.find(b=>b.id===GS.bird)||BIRDS[0];$('tapBird').textContent=bd.e;lastT=0;animId=requestAnimationFrame(loop);}
function beginFly(){running=true;$('tapScreen').classList.add('hidden');bird.vy=-8.4;sfxFlap();}
function showDead(){
  $('hud').classList.add('hidden');
  const s=score>=lv.id*15?3:score>=lv.id*8?2:score>=lv.id*3?1:0;
  const medals=['💀','🥉','🥈','🥇'],titles=['Yenidən cəhd et!','Pis deyil!','Çox yaxşı!','Əla! Supersan!'];
  $('deadMedal').textContent=medals[s];$('deadTitle').textContent=titles[s];$('deadScore').textContent=score;$('deadBest').textContent='🏆 Rekord: '+GS.best;$('deadEarned').textContent='+'+sessCoins+' 🪙 qazandın!';
  show('deadScreen');
}
function showShop(){renderShop();show('shopScreen');$('shopCoins').textContent=GS.coins;}
function renderShop(){
  const g=$('birdGrid');g.innerHTML='';
  BIRDS.forEach(b=>{const owned=GS.owned.includes(b.id),sel=GS.bird===b.id;const c=document.createElement('div');c.className='bird-card'+(sel?' selected':'');c.innerHTML=`${sel?'<div class="selected-tag">SEÇİLİB</div>':owned?'<div class="owned-tag">VAR</div>':''}<span class="bird-emoji">${b.e}</span><div class="bird-name">${b.n}</div><div style="font-size:11px;color:rgba(255,255,255,0.45);font-family:'Nunito',sans-serif;margin-bottom:4px">${b.d}</div>${owned?`<div class="bird-price" style="color:${sel?'var(--gold)':'var(--green)'}">${sel?'✓ Aktiv':'Seç'}</div>`:`<div class="bird-price">🪙 ${b.p}</div>`}`;c.addEventListener('click',()=>buyBird(b));g.appendChild(c);});
}
function buyBird(b){
  const owned=GS.owned.includes(b.id);
  if(owned){GS.bird=b.id;sv('bird',b.id);sfxBuy();renderShop();}
  else if(GS.coins>=b.p){GS.coins-=b.p;sv('coins',GS.coins);GS.owned.push(b.id);sv('owned',GS.owned);GS.bird=b.id;sv('bird',b.id);sfxLvlUp();$('shopCoins').textContent=GS.coins;renderShop();}
  else{const gc=document.getElementById('gc');gc.classList.remove('shake');void gc.offsetWidth;gc.classList.add('shake');beep(200,'square',0.2,0.3);}
}
function showLevels(){renderLevels();show('levelsScreen');}
function renderLevels(){
  const g=$('levelGrid');g.innerHTML='';
  LEVELS.forEach(l=>{const unlocked=GS.best>=l.need||l.id===1,active=GS.level===l.id,s=GS.stars[l.id]||0;const c=document.createElement('div');c.className='level-card'+(active?' active-lv':'')+(unlocked?'':' locked-lv');c.innerHTML=`<div class="level-num">${l.id}</div><div class="level-name">${l.n}</div><div class="level-stars-row">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div>${!unlocked?`<div style="font-size:10px;color:#aaa;font-family:'Nunito',sans-serif">🔒${l.need} xal</div>`:''}`;if(unlocked)c.addEventListener('click',()=>{GS.level=l.id;sv('level',l.id);sfxPoint();renderLevels();});g.appendChild(c);});
}
$('btnPlay').addEventListener('click',()=>{sfxFlap();startGame();});
$('btnShop').addEventListener('click',()=>{sfxFlap();showShop();});
$('btnLevels').addEventListener('click',()=>{sfxFlap();showLevels();});
$('btnRetry').addEventListener('click',()=>{sfxFlap();startGame();});
$('btnMenu').addEventListener('click',()=>{sfxFlap();showMenu();});
$('btnShopBack').addEventListener('click',()=>{sfxFlap();showMenu();});
$('btnLevelsBack').addEventListener('click',()=>{sfxFlap();showMenu();});
cvs.addEventListener('touchstart',e=>{e.preventDefault();if(!running&&!over){beginFly();}else{flap();}},{passive:false});
cvs.addEventListener('click',()=>{if(!running&&!over){beginFly();}else{flap();}});
$('tapScreen').addEventListener('touchstart',e=>{e.preventDefault();beginFly();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!$('tapScreen').classList.contains('hidden')){beginFly();return;}flap();}});
showMenu();
</script>
</body>
</html>
